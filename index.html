<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Библиотека</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 38%, #33201600 0%, #0d0705 78%),
      radial-gradient(ellipse 90% 70% at 50% 38%, #3a2417 0%, #1d120c 45%, #0b0605 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,218,166,.035) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 5px);
    opacity: .5;
    mix-blend-mode: overlay;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 26vw rgba(0,0,0,.92);
  }
  canvas {
    position: relative;
    background: #170f0c;
    border-radius: 3px;
    box-shadow:
      0 0 0 1px rgba(224,178,92,.22),
      0 0 0 7px rgba(24,14,9,.9),
      0 0 0 8px rgba(224,178,92,.14),
      0 26px 70px rgba(0,0,0,.75),
      0 0 120px rgba(255,170,90,.05);
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script src="game.js?v=52"></script>
</body>
</html>
