<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120608">
<title>Библиотека</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 38%, #48101c00 0%, #0c0406 78%),
      radial-gradient(ellipse 92% 72% at 50% 36%, #4a121d 0%, #210a10 42%, #090306 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,218,166,.035) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 5px);
    opacity: .5;
    mix-blend-mode: overlay;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 26vw rgba(0,0,0,.92);
  }
  canvas {
    position: relative;
    background: #120608;
    border-radius: 3px;
    box-shadow:
      0 0 0 1px rgba(224,178,92,.24),
      0 0 0 7px rgba(28,9,14,.92),
      0 0 0 8px rgba(224,178,92,.15),
      0 26px 70px rgba(0,0,0,.8),
      0 0 130px rgba(178,44,58,.13);
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    transition: filter .22s ease;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    text-align: center;
    padding: 24px;
    color: #e8d5ae;
    font-size: 18px;
    background: rgba(10, 4, 6, .92);
  }
  #rotate b { font-size: 22px; color: #e0b25c; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="rotate"><b>Поверни телефон</b><span>Игра лучше смотрится горизонтально</span></div>
<script src="game.js?v=112"></script>
</body>
</html>
